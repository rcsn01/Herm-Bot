name: Hermes plugins

on:
  push:
    paths:
      - 'mobile-push-delivery/**'
      - 'push-notification/**'
      - '.github/workflows/plugins.yml'
  pull_request:
    paths:
      - 'mobile-push-delivery/**'
      - 'push-notification/**'
      - '.github/workflows/plugins.yml'
  workflow_dispatch:

permissions:
  contents: read

# The mobile delivery plugin is tested through Hermes' real discovery path.
# Keep this revision explicit so a backend contract change is reviewable.
env:
  HERMES_AGENT_REF: fa75692211001f64b2a65557fd498725eb0fe32e

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_AGENT_REF }}
          path: hermes-agent
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the small Hermes import surface
        run: python -m pip install httpx==0.28.1 pyyaml==6.0.3
      - name: Test the standalone Bark plugin
        run: python -m unittest discover -s push-notification -p 'test_*.py'
      - name: Test Web Push plugin discovery against Hermes
        env:
          HERMES_AGENT_ROOT: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: python -m unittest discover -s mobile-push-delivery -p 'test_*.py'
