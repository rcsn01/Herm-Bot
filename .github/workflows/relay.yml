name: Web Push relay

on:
  push:
    paths:
      - 'web-push-relay/**'
      - '.github/workflows/relay.yml'
  pull_request:
    paths:
      - 'web-push-relay/**'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-push-relay
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-push-relay/package-lock.json
      - run: npm ci
      - run: npm test
