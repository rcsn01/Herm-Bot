name: Publish Docker images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish from main
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate release tag and prepare image names
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Manual release recovery must run from main, not $GITHUB_REF_NAME." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag like v1.2.3; got $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && ! git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Manual release recovery requires an existing remote tag: $RELEASE_TAG" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          client_version="$(jq -r '.version // empty' client/package.json)"
          client_lock_version="$(jq -r '.packages[""].version // .version // empty' client/package-lock.json)"
          relay_version="$(jq -r '.version // empty' web-push-relay/package.json)"
          relay_lock_version="$(jq -r '.packages[""].version // .version // empty' web-push-relay/package-lock.json)"
          if [[ "$client_version" != "$version" || "$client_lock_version" != "$version" || "$relay_version" != "$version" || "$relay_lock_version" != "$version" ]]; then
            echo "Release tag $RELEASE_TAG must match both package manifests and lockfiles (client=$client_version/$client_lock_version, relay=$relay_version/$relay_lock_version)." >&2
            exit 1
          fi
          VERSION="$version" node --input-type=module <<'NODE'
          import { parseSemver } from './scripts/release-version.mjs'
          if (!parseSemver(process.env.VERSION)) {
            console.error(`Invalid semantic version: ${process.env.VERSION}`)
            process.exit(1)
          }
          NODE

          if [[ "$version" == *-* ]]; then
            stable=false
          else
            stable=true
          fi

          repository_lc="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/$repository_lc" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_USERNAME" --password-stdin

      - uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name release-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and publish images
        env:
          IMAGE_PREFIX: ${{ steps.release.outputs.image_prefix }}
          VERSION: ${{ steps.release.outputs.version }}
          STABLE: ${{ steps.release.outputs.stable }}
        shell: bash
        run: |
          build_and_push() {
            local image="$1"
            local context="$2"
            local tags=(--tag "$image:$VERSION" --tag "$image:sha-$GITHUB_SHA")

            if [[ "$STABLE" == "true" ]]; then
              tags+=(--tag "$image:latest")
            fi

            docker buildx build \
              --pull \
              --platform linux/amd64,linux/arm64 \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              "${tags[@]}" \
              --push \
              "$context"
          }

          build_and_push "$IMAGE_PREFIX-pwa" .
          build_and_push "$IMAGE_PREFIX-web-push-relay" ./web-push-relay

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_STABLE: ${{ needs.publish.outputs.stable }}
        shell: bash
        run: |
          args=(release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Hermes Mobile $RELEASE_VERSION")
          if [[ "$RELEASE_STABLE" != "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
