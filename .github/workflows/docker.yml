name: Docker

on:
  push:
    paths:
      - 'client/**'
      - 'deploy/**'
      - 'web-push-relay/**'
      - 'Dockerfile'
      - 'Dockerfile.dockerignore'
      - 'docker-compose.yml'
      - 'compose.build.yaml'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'deploy/**'
      - 'web-push-relay/**'
      - 'Dockerfile'
      - 'Dockerfile.dockerignore'
      - 'docker-compose.yml'
      - 'compose.build.yaml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMES_GATEWAY: host.docker.internal:8642
      HERMES_WEB_PUSH_TOKEN: ci-only-token
      WEBPUSH_PWA_URL: https://mobile.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.build.yaml config --quiet
      - name: Build the PWA image
        run: docker build --tag hermes-mobile-pwa:ci .
      - name: Build the relay image
        run: docker build --tag hermes-mobile-web-push-relay:ci ./web-push-relay
