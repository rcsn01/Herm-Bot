# Deploy the published GHCR images without cloning the source or building locally.
# Configure the required gateway and public PWA origin in .env first.
services:
  mobile:
    image: ghcr.io/rcsn01/herm-bot-pwa:${HERMES_MOBILE_VERSION:-0.1.1}
    pull_policy: always
    ports:
      - "${HERMES_MOBILE_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HERMES_GATEWAY: ${HERMES_GATEWAY:-}
      HERMES_URL: ${HERMES_URL:-}
    depends_on:
      web-push-relay:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web-push-relay:
    image: ghcr.io/rcsn01/herm-bot-web-push-relay:${HERMES_MOBILE_VERSION:-0.1.1}
    pull_policy: always
    environment:
      HERMES_WEB_PUSH_APP_URL: ${WEBPUSH_PWA_URL:?set WEBPUSH_PWA_URL in .env}
      HERMES_WEB_PUSH_SUBJECT: ${HERMES_WEB_PUSH_SUBJECT:-}
      HERMES_COMPLETION_BRIDGE_ENABLED: ${HERMES_COMPLETION_BRIDGE_ENABLED:-true}
      HERMES_GATEWAY: ${HERMES_GATEWAY:-}
      HERMES_URL: ${HERMES_URL:-}
      HERMES_BRIDGE_TOKEN: ${HERMES_BRIDGE_TOKEN:-}
      HERMES_BRIDGE_USERNAME: ${HERMES_BRIDGE_USERNAME:-}
      HERMES_BRIDGE_PASSWORD: ${HERMES_BRIDGE_PASSWORD:-}
      HERMES_BRIDGE_AUTH_PROVIDER: ${HERMES_BRIDGE_AUTH_PROVIDER:-password}
      HERMES_BRIDGE_POLL_INTERVAL_MS: ${HERMES_BRIDGE_POLL_INTERVAL_MS:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - web-push-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  web-push-data:
