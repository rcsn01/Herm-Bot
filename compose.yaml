services:
  mobile:
    build:
      context: ../..
      dockerfile: apps/mobile/Dockerfile
    image: hermes-mobile-pwa:local
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Point at your Hermes HTTP backend (host:port). Compose also reads .env.
    environment:
      HERMES_GATEWAY: ${HERMES_GATEWAY:-}
      HERMES_URL: ${HERMES_URL:-}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
