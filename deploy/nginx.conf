worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Deliberately omit $request and $args: OAuth codes, tokens, and other
    # query parameters must not be written to the access log.
    log_format safe '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout safe;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        ~*^https$ https;
        ~*^http$  http;
        default   $scheme;
    }

    sendfile on;
    keepalive_timeout 65;
    # Files upload as JSON data URLs, with a 50 MB decoded client limit.
    client_max_body_size 72m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /tmp/hermes-gateway.conf;

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # Authentication and API routes always go to the fixed operator-set
        # upstream. No request value participates in upstream selection.
        error_page 418 = @hermes_gateway;
        location = /api { return 418; }
        location ^~ /api/ { return 418; }
        location = /auth { return 418; }
        location ^~ /auth/ { return 418; }
        location = /login { return 418; }

        location @hermes_gateway {
            # nginx upstream errors include the full URI, including WS tokens.
            # The sanitized access log still reports failures and status codes.
            error_log /dev/null;
            proxy_pass http://hermes_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            add_header Cache-Control "no-store" always;
        }

        # Keep update-sensitive PWA entry points ahead of the general .js rule.
        location ~* ^/(?:index\.html|manifest(?:\.webmanifest|\.json)?|sw\.js)$ {
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-store" always;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public filenames are not content-hashed. Revalidate icons and never
        # return the HTML shell for a missing JS/CSS/image file.
        location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
        }

        # Includes /session/... and all other client-side routes.
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store" always;
        }
    }
}
